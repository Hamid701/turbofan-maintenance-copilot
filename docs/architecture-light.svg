<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<!-- Generated. The light and dark variants differ only in the palette below. -->
<title id="title">Turbofan Maintenance Copilot architecture</title>
<desc id="desc">One question's path through the copilot. Every step is deterministic code except the highlighted OpenAI call, which writes the prose and picks passage numbers. Citations and engine figures come from code and data. Dashed exits are the two refusal points.</desc>
<style>
    .bg { fill: #f6f8fa; stroke: #d1d9e0; }
    .box { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
    .frame { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .llm { fill: #e6f3f7; stroke: #0b6e8f; stroke-width: 1.6; }
    .pill { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.2; stroke-dasharray: 4 3; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .t { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .s { fill: #59636e; font-size: 11px; }
    .band { fill: #59636e; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .lbl { fill: #59636e; font-size: 11px; }
    .t-accent { fill: #0b6e8f; font-size: 13px; font-weight: 600; }
    .s-accent { fill: #0b6e8f; font-size: 11px; }
    .t-warn { fill: #7d4e00; font-size: 12px; font-weight: 600; }
    .s-warn { fill: #7d4e00; font-size: 11px; }
    .lbl-accent { fill: #0b6e8f; font-size: 11px; }
    .edge { stroke: #59636e; stroke-width: 1.4; fill: none; }
    .edge-accent { stroke: #0b6e8f; stroke-width: 1.6; fill: none; }
    .edge-warn { stroke: #9a6700; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
    .head { fill: #59636e; }
    .head-accent { fill: #0b6e8f; }
    .head-warn { fill: #9a6700; }
    </style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-warn"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="599" rx="14" class="bg"/>
