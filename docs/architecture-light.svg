<line x1="430" y1="243.0" x2="490" y2="243.0" class="edge" marker-end="url(#arrow)"/>
<text x="460" y="262.0" text-anchor="middle" class="lbl">passages</text>
<line x1="620" y1="243.0" x2="680" y2="243.0" class="edge" marker-end="url(#arrow)"/>
<text x="650" y="262.0" text-anchor="middle" class="lbl">+ report</text>
<line x1="790" y1="243.0" x2="840" y2="243.0" class="edge" marker-end="url(#arrow)"/>
<text x="815" y="262.0" text-anchor="middle" class="lbl">numbers</text>
<rect x="660" y="64" width="110" height="60" rx="8" class="llm"/>
<text x="715.0" y="90.0" text-anchor="middle" class="t-accent">OpenAI API</text>
<text x="715.0" y="106.0" text-anchor="middle" class="s-accent">gpt-4o-mini</text>
<line x1="700" y1="208" x2="700" y2="124" class="edge-accent" marker-end="url(#arrow-accent)"/>
<text x="694" y="152" text-anchor="end" class="lbl-accent">prompt</text>
