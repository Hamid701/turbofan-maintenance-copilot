<line x1="815" y1="243.0" x2="815" y2="132" class="edge-warn" marker-end="url(#arrow-warn)"/>
<rect x="150" y="360" width="800" height="76" rx="10" class="box"/>
<text x="166" y="384" text-anchor="start" class="t">PostgreSQL 17 + pgvector</text>
<text x="166" y="416" text-anchor="start" class="s">query runs + feedback</text>
<text x="365" y="416" text-anchor="middle" class="s">chunks + vectors (HNSW)</text>
<text x="555" y="416" text-anchor="middle" class="s">sensor readings, RUL targets</text>
<text x="934" y="416" text-anchor="end" class="s">one database, 36 MB</text>
<line x1="210" y1="278" x2="210" y2="360" class="edge" marker-end="url(#arrow)"/>
<text x="216" y="334" text-anchor="start" class="lbl">logs each query</text>
<line x1="365" y1="360" x2="365" y2="278" class="edge" marker-end="url(#arrow)"/>
<text x="371" y="334" text-anchor="start" class="lbl">loaded at startup</text>
<line x1="555" y1="360" x2="555" y2="278" class="edge" marker-end="url(#arrow)"/>
<text x="561" y="334" text-anchor="start" class="lbl">sensor rows</text>
<text x="24" y="482" text-anchor="start" class="band">BUILD ONCE, OFFLINE</text>
<rect x="20" y="500" width="120" height="60" rx="8" class="box"/>
<text x="80.0" y="526.0" text-anchor="middle" class="t">FAA handbook</text>
<text x="80.0" y="542.0" text-anchor="middle" class="s">3 PDF chapters</text>
<rect x="170" y="500" width="100" height="60" rx="8" class="box"/>
<text x="220.0" y="518.0" text-anchor="middle" class="t">Chunks</text>
<text x="220.0" y="534.0" text-anchor="middle" class="s">700 chars</text>
<text x="220.0" y="550.0" text-anchor="middle" class="s">one page each</text>
<rect x="300" y="500" width="130" height="60" rx="8" class="box"/>
<text x="365.0" y="526.0" text-anchor="middle" class="t">BGE-small</text>
<text x="365.0" y="542.0" text-anchor="middle" class="s">384-d vectors</text>
