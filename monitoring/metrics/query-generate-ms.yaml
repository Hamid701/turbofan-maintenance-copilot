# Time inside the model call alone. Measured locally and on Cloud Run at about
# 90% of a question's latency, so this is the figure to watch when answers slow down.
name: turbofan_query_generate_ms
description: Time spent in the generation stage of one question, in milliseconds.
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="turbofan-copilot"
  AND jsonPayload.event="query"
  AND jsonPayload.stage_ms.generate>0
valueExtractor: EXTRACT(jsonPayload.stage_ms.generate)
labelExtractors:
  model: EXTRACT(jsonPayload.model)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 20
    growthFactor: 2
    scale: 10
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: ms
  labels:
    - key: model
      valueType: STRING
      description: the generation model that answered
