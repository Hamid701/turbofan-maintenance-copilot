name: turbofan-copilot

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turbofan}
      POSTGRES_USER: ${POSTGRES_USER:-turbofan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Inside the compose network the database is reachable by service name,
      # not on localhost as it is from the host shell.
      TURBOFAN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-turbofan}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}@postgres:5432/${POSTGRES_DB:-turbofan}
      TURBOFAN_ENVIRONMENT: ${TURBOFAN_ENVIRONMENT:-development}
      TURBOFAN_LOG_LEVEL: ${TURBOFAN_LOG_LEVEL:-INFO}
      # Optional. Without a key the service still starts and serves /health;
      # POST /v1/query fails loudly on first use rather than at boot.
      TURBOFAN_OPENAI_API_KEY: ${TURBOFAN_OPENAI_API_KEY:-}
      TURBOFAN_INGEST_API_KEY: ${TURBOFAN_INGEST_API_KEY:-}
    ports:
      - "${TURBOFAN_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
