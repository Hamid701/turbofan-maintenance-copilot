[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "turbofan-maintenance-copilot"
version = "0.1.0"
description = "A learning-first, evidence-grounded turbofan maintenance copilot."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1,<2",
    "fastapi>=0,<1",
    "pandas>=2.2,<4",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3,<4",
    "pydantic-settings>=2,<3",
    "pypdf>=6.10,<7",
    "sqlalchemy>=2,<3",
    "torch>=2.14,<3",
    "transformers>=4.41,<5",
    "uvicorn>=0,<1",
]

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "httpx2>=2,<3",
    "mypy>=1.18,<2",
    "pandas-stubs>=3,<4",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
markers = [
    "integration: requires a live PostgreSQL database (docker compose up -d postgres)",
]
pythonpath = ["src"]
testpaths = [
    "tests/unit",
    "tests/integration",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["turbofan_copilot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
