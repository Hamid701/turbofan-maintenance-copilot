[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "turbofan-maintenance-copilot"
version = "0.1.0"
description = "A learning-first, evidence-grounded turbofan maintenance copilot."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1,<2",
    "fastapi>=0,<1",
    "langchain-core>=0.3,<0.4",
    "openai>=1,<2",
    "pandas>=2.2,<4",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3,<4",
    "pydantic-settings>=2,<3",
    "pypdf>=6.10,<7",
    "scikit-learn>=1.7,<2",
    "sqlalchemy>=2,<3",
    "torch>=2.14,<3",
    "transformers>=4.41,<5",
    "uvicorn>=0,<1",
]

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "httpx2>=2,<3",
    "mypy>=1.18,<2",
    "pandas-stubs>=3,<4",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.uv]
# regex is a transitive dependency of transformers. Its 2026.9.x builds are days
# old and carry no code-signing reputation, so Windows Smart App Control refuses
# to load the extension DLL ("An Application Control policy has blocked this
# file"), which breaks every import of transformers. Holding it to an
# established build keeps the environment installable on Windows. Remove this
# once the newer releases have gained reputation.
# scipy arrives with scikit-learn and hits the same wall: the 1.18.x extension
# DLLs are too new to carry reputation, so `import scipy.stats` dies on
# `levyst` and takes scikit-learn with it.
constraint-dependencies = ["regex<2026", "scipy<1.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
markers = [
    "integration: requires a live PostgreSQL database (docker compose up -d postgres)",
]
pythonpath = ["src"]
testpaths = [
    "tests/unit",
    "tests/integration",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends(...) in argument defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
# scikit-learn ships no py.typed marker, so mypy cannot see its types. Scoped to
# scikit-learn alone; every other module stays strictly checked.
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["turbofan_copilot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
